<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Telemetri Mobil RC</title>
    <style>
        :root {
            --bg-color: #211e1f; /* Lavender Blush - Soft Pink */
            --card-bg: #fd8fd3;
            --text-dark: #5D4037;
            --pink-main: #FF69B4; /* Hot Pink */
            --pink-light: #FFE4E1; /* Misty Rose */
            --pink-dark: #D81B60;
            --safe-color: #2ED573;
            --danger-color: #FF4757;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--pink-dark);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .header p {
            color: var(--pink-main);
            margin-top: 0;
            font-weight: 500;
        }

        .connection-status {
            display: inline-block;
            padding: 5px 15px;
            background-color: #FFA502;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 182, 193, 0.6);
        }

        .card h3 {
            margin: 0 0 15px 0;
            color: var(--pink-dark);
            font-size: 1.2em;
        }

        /* Desain Indikator Melingkar (SVG) */
        .circular-chart {
            display: block;
            margin: 0 auto;
            max-width: 80%;
            max-height: 250px;
        }

        .circle-bg {
            fill: none;
            stroke: var(--pink-light);
            stroke-width: 3.8;
        }

        .circle {
            fill: none;
            stroke-width: 2.8;
            stroke-linecap: round;
            transition: stroke-dasharray 0.8s ease-out, stroke 0.3s ease;
        }

        /* Warna spesifik tiap sensor */
        .color-temp { stroke: #FF7675; } /* Merah pudar untuk suhu */
        .color-hum { stroke: #74B9FF; }  /* Biru pudar untuk kelembapan */
        .color-gas { stroke: var(--pink-main); }
        .color-dist { stroke: #A29BFE; } /* Ungu untuk jarak */

        .percentage {
            fill: var(--text-dark);
            font-family: sans-serif;
            font-size: 0.45em;
            text-anchor: middle;
            font-weight: bold;
        }

        .sensor-label {
            fill: #999;
            font-family: sans-serif;
            font-size: 0.18em;
            text-anchor: middle;
        }

        .status-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 15px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
            color: white;
            background-color: var(--safe-color);
            transition: background-color 0.3s ease;
        }

        .status-danger {
            background-color: var(--danger-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Dashboard RC Car</h1>
        <p>IoT Telemetry Monitor - ESP32</p>
        <div id="conn-status" class="connection-status">Menghubungkan ke Firebase...</div>
    </div>

    <div class="grid-container">
        <!-- Sensor Suhu (DHT22) -->
        <div class="card">
            <h3>Suhu Lingkungan</h3>
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle color-temp" id="circle-temp" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="19" class="percentage" id="val-temp">0</text>
                <text x="18" y="24" class="sensor-label">°C</text>
            </svg>
            <div id="status-temp" class="status-badge">Normal</div>
        </div>

        <!-- Sensor Kelembapan (DHT22) -->
        <div class="card">
            <h3>Kelembapan Udara</h3>
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle color-hum" id="circle-hum" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="19" class="percentage" id="val-hum">0</text>
                <text x="18" y="24" class="sensor-label">%</text>
            </svg>
            <div id="status-hum" class="status-badge">Normal</div>
        </div>

        <!-- Sensor Gas (MQ-2) -->
        <div class="card">
            <h3>Kadar Gas / Asap (MQ-2)</h3>
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle color-gas" id="circle-gas" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="19" class="percentage" id="val-gas">0</text>
                <text x="18" y="24" class="sensor-label">Raw (ESP32)</text>
            </svg>
            <div id="status-gas" class="status-badge">Udara Bersih</div>
        </div>

        <!-- Sensor Jarak (HC-SR04) -->
        <div class="card">
            <h3>Jarak Rintangan</h3>
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle color-dist" id="circle-dist" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="19" class="percentage" id="val-dist">0</text>
                <text x="18" y="24" class="sensor-label">CM</text>
            </svg>
            <div id="status-dist" class="status-badge">Jalan Aman</div>
        </div>
    </div>

    <script>
        // Data host dan autentikasi yang diberikan
        const FIREBASE_URL = "https://rc-telementri-default-rtdb.asia-southeast1.firebasedatabase.app";
        const FIREBASE_AUTH = "y4KdPtOZOokvMWl8qdZuSUpeOla0NAXgQsOW5a02";
        
        // Path/node yang disasar dalam database (Asumsi ESP32 mengirim ke node '/monitoring')
        const DB_PATH = "/monitoring.json"; 
        
        // URL lengkap dengan Auth
        const streamUrl = `${FIREBASE_URL}${DB_PATH}?auth=${FIREBASE_AUTH}`;

        // State variabel untuk menampung data sensor
        let sensorData = { suhu: 0, kelembapan: 0, gas: 0, jarak: 0 };

        // Inisialisasi EventSource untuk menerima update data Realtime via REST API
        const eventSource = new EventSource(streamUrl);
        const statusText = document.getElementById('conn-status');

        eventSource.onopen = () => {
            statusText.textContent = "Terhubung secara Real-Time";
            statusText.style.backgroundColor = "#2ED573"; // Hijau
        };

        eventSource.onerror = (err) => {
            console.error("EventSource failed:", err);
            statusText.textContent = "Koneksi Terputus / Error";
            statusText.style.backgroundColor = "#FF4757"; // Merah
        };

        eventSource.addEventListener('put', handleFirebaseData);
        eventSource.addEventListener('patch', handleFirebaseData);

        function handleFirebaseData(event) {
            const payload = JSON.parse(event.data);
            
            if (payload.path === "/") {
                if(payload.data) sensorData = { ...sensorData, ...payload.data };
            } else {
                const key = payload.path.substring(1); 
                sensorData[key] = payload.data;
            }
            updateDashboard();
        }

        // Fungsi pembaruan Indikator Visual (Gauges)
        function updateGauge(idPrefix, value, min, max) {
            let percentage = ((value - min) / (max - min)) * 100;
            // Batasi persentase di angka 0 - 100
            if (percentage > 100) percentage = 100;
            if (percentage < 0) percentage = 0;

            const circle = document.getElementById(`circle-${idPrefix}`);
            const textVal = document.getElementById(`val-${idPrefix}`);
            
            circle.setAttribute('stroke-dasharray', `${percentage}, 100`);
            textVal.textContent = parseFloat(value).toFixed(1).replace('.0', '');
        }

        // Fungsi evaluasi status sirkuit/sensor 
        function updateDashboard() {
            // Update DHT22 Suhu (Range Asumsi: 0 - 50 °C)
            updateGauge('temp', sensorData.suhu || 0, 0, 50);
            const badgeTemp = document.getElementById('status-temp');
            if(sensorData.suhu > 35) {
                badgeTemp.textContent = "Overheat!";
                badgeTemp.className = "status-badge status-danger";
            } else {
                badgeTemp.textContent = "Suhu Aman";
                badgeTemp.className = "status-badge";
            }

            // Update DHT22 Kelembapan (Range: 0 - 100 %)
            updateGauge('hum', sensorData.kelembapan || 0, 0, 100);

            // Update MQ-2 Gas/Smoke
            // Range ESP32 Analog biasanya 0 - 4095. Menggunakan integrasi sirkuit alarm 
            // kita dapat menyalakan peringatan bahaya saat melampaui batas ambang tertentu.
            updateGauge('gas', sensorData.gas || 0, 0, 4095);
            const badgeGas = document.getElementById('status-gas');
            if((sensorData.gas || 0) > 1500) { 
                badgeGas.textContent = "⚠️ Deteksi Gas/Asap!";
                badgeGas.className = "status-badge status-danger";
            } else {
                badgeGas.textContent = "Udara Bersih";
                badgeGas.className = "status-badge";
            }

            // Update HC-SR04 Jarak (Range Asumsi: 0 - 200 CM)
            updateGauge('dist', sensorData.jarak || 0, 0, 200);
            const badgeDist = document.getElementById('status-dist');
            if((sensorData.jarak || 0) < 15 && (sensorData.jarak || 0) > 0) { 
                badgeDist.textContent = "⚠️ Awas Tabrakan!";
                badgeDist.className = "status-badge status-danger";
            } else {
                badgeDist.textContent = "Jalan Aman";
                badgeDist.className = "status-badge";
            }
        }
    </script>
</body>
</html>
