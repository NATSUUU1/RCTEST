<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  databaseURL:
    "https://rc-telementri-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* =========================================================
   ELEMENT CACHE
   Supaya browser tidak berulang kali mencari elemen HTML
========================================================= */

const $ = id => document.getElementById(id);

const el = {
  gas: $("gasValue"),
  hum: $("humValue"),
  temp: $("tempValue"),
  dist: $("distValue"),

  action: $("actionValue"),
  buzzer: $("buzzerValue"),

  status: $("status"),
  statusText: $("statusText"),
  lastUpdate: $("lastUpdate"),
  connection: $("connection"),

  wheelGas: $("wheelGas"),
  wheelHum: $("wheelHum"),
  wheelTemp: $("wheelTemp"),
  wheelDist: $("wheelDist"),
  wheelAction: $("wheelAction"),
  wheelBuzzer: $("wheelBuzzer")
};


/* =========================================================
   CHART CONFIG
========================================================= */

const maxPoints = 15;

Chart.defaults.color = "#9b7f8c";
Chart.defaults.font.family = "DM Sans";
Chart.defaults.font.size = 10;


function createChart(id, label, color, max) {

  return new Chart($(id), {

    type: "line",

    data: {
      labels: [],

      datasets: [{
        label: label,
        data: [],

        borderColor: color,
        backgroundColor: color + "18",

        borderWidth: 2.5,

        fill: true,

        tension: 0.3,

        pointRadius: 0,
        pointHoverRadius: 5
      }]
    },

    options: {

      responsive: true,

      maintainAspectRatio: false,

      /* Penting:
         Tidak ada animasi grafik yang berat */
      animation: false,

      interaction: {
        intersect: false,
        mode: "index"
      },

      plugins: {

        legend: {
          display: false
        },

        tooltip: {
          displayColors: false,
          backgroundColor: "#573f4c",
          padding: 10,
          cornerRadius: 10
        }
      },

      scales: {

        y: {
          min: 0,
          suggestedMax: max,

          border: {
            display: false
          },

          grid: {
            color: "rgba(180,130,150,.10)"
          }
        },

        x: {

          border: {
            display: false
          },

          grid: {
            display: false
          },

          ticks: {
            maxTicksLimit: 6
          }
        }
      }
    }
  });
}


/* =========================================================
   CREATE CHART
========================================================= */

const gasChart =
  createChart("gasChart", "Gas", "#e85d93", 4095);

const humChart =
  createChart("humChart", "Humidity", "#77bfe4", 100);

const tempChart =
  createChart("tempChart", "Temperature", "#f3bd65", 50);

const distChart =
  createChart("distChart", "Distance", "#7bcfba", 200);


/* =========================================================
   UPDATE TEXT
========================================================= */

function setText(element, value, decimal = 0) {

  const number = Number(value);

  element.textContent =
    Number.isFinite(number)
      ? number.toFixed(decimal)
      : "—";
}


/* =========================================================
   UPDATE CHART
========================================================= */

function addPoint(chart, value, label) {

  chart.data.labels.push(label);

  chart.data.datasets[0].data.push(value);

  if (chart.data.labels.length > maxPoints) {

    chart.data.labels.shift();

    chart.data.datasets[0].data.shift();
  }

  /* Update langsung tanpa animasi */
  chart.update("none");
}


/* =========================================================
   SENSOR DATA
========================================================= */

const sensorRef = ref(db, "Sensor");


/*
   ========================================================
   PENTING

   Data diproses LANGSUNG di dalam onValue().

   Tidak menggunakan:

       setInterval(..., 1000)

   sehingga tidak ada delay buatan 1 detik.
   ========================================================
*/

onValue(
  sensorRef,

  snapshot => {

    const data = snapshot.val();

    if (!data) return;


    /* =====================================================
       BACA SENSOR
    ===================================================== */

    const gas =
      Number(data.Gas) || 0;

    const hum =
      Number(data.Kelembapan) || 0;

    const temp =
      Number(data.Suhu) || 0;

    const dist =
      Number(data.Jarak) || 0;


    /* =====================================================
       WAKTU UPDATE
    ===================================================== */

    const now = new Date();

    const time =
      now.toLocaleTimeString("id-ID", {
        hour12: false
      });


    /* =====================================================
       UPDATE ANGKA SENSOR
    ===================================================== */

    setText(el.gas, gas);

    setText(el.hum, hum, 1);

    setText(el.temp, temp, 1);

    setText(el.dist, dist, 1);


    /* =====================================================
       UPDATE GRAFIK
    ===================================================== */

    addPoint(
      gasChart,
      gas,
      time
    );

    addPoint(
      humChart,
      hum,
      time
    );

    addPoint(
      tempChart,
      temp,
      time
    );

    addPoint(
      distChart,
      dist,
      time
    );


    /* =====================================================
       ALARM
    ===================================================== */

    const alarm =
      gas > 2000 ||
      hum > 80;


    if (alarm) {

      el.status.classList.add("danger");

      el.statusText.textContent =
        "⚠ WARNING · THRESHOLD EXCEEDED";

      el.buzzer.textContent =
        "MENYALA";

      el.buzzer.style.color =
        "var(--rose)";

    } else {

      el.status.classList.remove("danger");

      el.statusText.textContent =
        "♡ SYSTEM ONLINE · REALTIME";

      el.buzzer.textContent =
        "STANDBY";

      el.buzzer.style.color =
        "var(--text)";
    }


    /* =====================================================
       RADAR / ROBOT
    ===================================================== */

    const isObstacle =
      dist > 0 &&
      dist < 25;


    if (isObstacle) {

      el.action.textContent =
        "MENGHINDAR";

      el.action.style.color =
        "var(--rose)";

    } else {

      el.action.textContent =
        "MAJU (AMAN)";

      el.action.style.color =
        "var(--text)";
    }


    /* =====================================================
       SENSOR WHEELS
    ===================================================== */

    el.wheelGas.classList.add("active");

    el.wheelHum.classList.add("active");

    el.wheelTemp.classList.add("active");

    el.wheelDist.classList.add("active");


    el.wheelAction.classList.toggle(
      "active",
      isObstacle
    );


    el.wheelBuzzer.classList.toggle(
      "active",
      alarm
    );


    /* =====================================================
       LAST UPDATE
    ===================================================== */

    el.lastUpdate.textContent =
      "⚡ Realtime " + time;
  },


  /* =======================================================
     ERROR
  ======================================================= */

  error => {

    el.statusText.textContent =
      "Koneksi sensor bermasalah";

    el.connection.textContent =
      "CONNECTION ERROR";

    console.error(
      "Firebase:",
      error
    );
  }
);


/* =========================================================
   FIREBASE CONNECTION MONITOR
========================================================= */

const connectedRef =
  ref(db, ".info/connected");


onValue(
  connectedRef,

  snapshot => {

    const online =
      snapshot.val() === true;


    if (online) {

      el.connection.textContent =
        "● FIREBASE CONNECTED · REALTIME";

    } else {

      el.connection.textContent =
        "○ FIREBASE OFFLINE";
    }
  }
);
</script>
